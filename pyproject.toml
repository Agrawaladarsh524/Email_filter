[project]
name = "email-filter"
version = "0.1.0"
description = "Automated Gmail triage: FastAPI service with LLM classification, label management, multi-channel alerts"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.60.0",
    "google-api-python-client>=2.179.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
]

[project.scripts]
email-filter = "email_filter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_filter"]
